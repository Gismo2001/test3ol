<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="X-UA-Compatible" content="IE=EDGE" /> 
    <title>GB 1 web map</title>
    <link rel="favicon" href="data/favicon.ico">
    <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol-layerswitcher@latest/src/ol-layerswitcher.css">
    <link rel="stylesheet" href="https://viglino.github.io/ol-ext/dist/ol-ext.css" /> 
    <link rel="stylesheet" href="node_modules/ol-ext/dist/ol-ext.css">
    <link rel="stylesheet" href="node_modules/ol/ol.css">
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol-contextmenu@latest/dist/ol-contextmenu.css">
    <style>
      body {
        /* overflow: hidden; */
        margin: 0;
      }
      
      .ol-legend > canvas {
        float: left;
      }
      .ol-legend > div.ol-legend {
        position: relative;
      }
    </style>
    
    <script type="text/javascript" src="https://cdn.rawgit.com/eligrey/FileSaver.js/aa9f4e0e/FileSaver.min.js"></script>
    
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ol-contextmenu"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script type="module" src="./main.js"></script>
  

  </head>
<body>
  <div id="map" tabindex="0"></div>

  <div id="coordinate_selection" style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; z-index: 1100; display: none;">
    <select name="coord_choice" id="coord_select">
      <option value="EPSG:32632" selected>EPSG:32632 (UTM, WGS84)</option>
      <option value="EPSG:25832">EPSG:25832 (UTM, ETRS89)</option>
      <option value="EPSG:3857">EPSG:3857 (Web Mercator)</option>
      <option value="EPSG:4326">EPSG:4326 (Länge-/Breite)</option>
      <option value="EPSG:31467">EPSG:31467 (GK, 3M)</option>
      <option value="EPSG:31466">EPSG:31466 (GK, 2M)</option>
    </select>
  </div>

  <div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>  
  </div>

  <input type="file" id="geojsonInput" accept=".geojson,.json" style="display: none;" multiple>
  <div id="custom-controls" class="custom-controls"></div>

  <div id="notification">
      <p>Es gab einen Fehler bei der Standortbestimmung.</p>
      <p>Möchten Sie es erneut versuchen? <span id="retryButton" style="cursor:pointer; text-decoration:underline;">Erneut versuchen</span></p>
  </div>

  <div id="search-results-container">
      <button id="close-search-results" onclick="closeSearchResults()">✖</button>
      <h3>Suchergebnisse</h3>
      <ul id="search-results"></ul>
  </div>

  <div id="height-status-container" class="height-status">
    Höhe: <span id="height-value-main">–</span> m
  </div>

  <div id="height-info-box" style="position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 4px; pointer-events: none; display: none; z-index: 1000;">
    HA: <span id="height-value-alt">-</span> m
  </div>

  <canvas id="myChart" width="400" height="200"></canvas>

<div id="table-container" style="display:none; position: fixed; bottom: 0; width: 100%; height: 300px; background: white; z-index: 2000; border-top: 2px solid #ccc;">
    <button onclick="document.getElementById('table-container').style.display='none'">Schließen</button>
    <div id="feature-table"></div>
</div>


</body>
</html>
